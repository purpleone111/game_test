const N=7,START=20,CAP=60,ORB_NAMES=['blue','gold','red','purple'];const $=s=>document.querySelector(s);let board=[],nextId=1,playing=false,busy=false,score=0,best=0,seconds=START,lastTick=0,elapsedRun=0,pace=1,lastPaceLevel=1,interval=0,lastPop=0,streak=0,bestStreak=0,moves=0,sound=true,audio=null;
try{best=Number(localStorage.getItem('one-more-orbs-best')||0)}catch(e){}$('#best').textContent=best;
const rand=n=>Math.floor(Math.random()*n),orb=()=>({id:nextId++,c:rand(4)}),at=i=>({x:i%N,y:Math.floor(i/N)});
function around(i){let x=i%N,y=Math.floor(i/N),a=[];if(x)a.push(i-1);if(x<N-1)a.push(i+1);if(y)a.push(i-N);if(y<N-1)a.push(i+N);return a}
function group(i){let c=board[i]?.c;if(c===undefined)return[];let seen=new Set([i]),stack=[i];while(stack.length)for(let n of around(stack.pop()))if(!seen.has(n)&&board[n]?.c===c){seen.add(n);stack.push(n)}return[...seen]}
function ensureMove(){if(board.some((o,i)=>around(i).some(j=>board[j]?.c===o.c)))return;let i=rand(N*N),a=around(i);board[a[rand(a.length)]].c=board[i].c}
function put(o,i,fall=false){let el=document.createElement('button'),p=at(i);el.className='orb';el.type='button';el.dataset.id=o.id;el.dataset.i=i;el.dataset.c=o.c;el.setAttribute('aria-label',ORB_NAMES[o.c]+' orb');let dx=(o.id*17)%7-3,dy=(o.id*23)%7-3,tilt=(o.id*11)%13-6;el.style.setProperty('--dx',dx+'px');el.style.setProperty('--dy',dy+'px');el.style.setProperty('--tilt',tilt+'deg');el.style.setProperty('--fromdx',-dx+'px');el.style.setProperty('--fromdy',-dy+'px');el.style.setProperty('--fromtilt',-tilt+'deg');el.style.setProperty('--delay',(-((o.id*37)%17)/10)+'s');el.innerHTML='<span class="energy"></span>';el.style.left=(p.x/N*100)+'%';el.style.top=((fall?-2-rand(3):p.y)/N*100)+'%';$('#field').append(el);if(fall)requestAnimationFrame(()=>{el.style.top=(p.y/N*100)+'%'})}
function paint(){let nodes=new Map([...$('#field').children].map(el=>[Number(el.dataset.id),el]));for(let i=0;i<board.length;i++){let o=board[i],el=nodes.get(o.id),p=at(i);if(el){el.dataset.i=i;el.dataset.c=o.c;el.style.left=(p.x/N*100)+'%';el.style.top=(p.y/N*100)+'%';nodes.delete(o.id)}else put(o,i,true)}for(let el of nodes.values())el.remove()}
function seed(){board=Array.from({length:N*N},orb);ensureMove();$('#field').replaceChildren();for(let i=0;i<board.length;i++)put(board[i],i)}
function refill(){for(let x=0;x<N;x++){let kept=[];for(let y=N-1;y>=0;y--){let o=board[y*N+x];if(o)kept.push(o)}for(let y=N-1;y>=0;y--)board[y*N+x]=kept[N-1-y]||orb()}ensureMove();paint()}
function float(txt,x,y,time=false){let el=document.createElement('div');el.className='float'+(time?' timebonus':'');el.textContent=txt;el.style.left=Math.max(6,x-27)+'px';el.style.top=Math.max(6,y-15)+'px';document.body.append(el);setTimeout(()=>el.remove(),820)}
function audioReady(){if(!sound)return null;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{});return audio}catch(e){return null}}
function note(hz,d=.09,delay=0,type='sine',volume=.07,slide=1){let a=audioReady();if(!a)return;let t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(hz,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,hz*slide),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
function popSound(count,combo){let pitch=270+Math.min(10,count)*34;note(pitch,.11,0,'sine',.08,1.6);note(pitch*1.5,.16,.04,'triangle',.035,1.25);if(count>=5||combo>=3)note(pitch*2,.24,.11,'sine',.035,1.2)}
function missSound(){note(170,.09,0,'triangle',.035,.7)}
function levelSound(){note(490,.13);note(660,.16,.11);note(880,.22,.22)}
function endSound(){note(360,.2,0,'sine',.055,.65);note(220,.34,.17,'triangle',.04,.6)}
function clearPreview(){$('#field').querySelectorAll('.preview').forEach(x=>x.classList.remove('preview'))}
function preview(e){clearPreview();let el=e.target.closest('.orb');if(!el||!playing||busy)return;let cells=group(Number(el.dataset.i));if(cells.length>1)for(let i of cells)$('#field').querySelector(`[data-i="${i}"]`)?.classList.add('preview')}
function pop(i,el){if(!playing||busy)return;let cells=group(i);if(cells.length<2){el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),200);missSound();return}busy=true;clearPreview();for(let n of cells)$('#field').querySelector(`[data-i="${n}"]`)?.classList.add('pop');let r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,now=performance.now();streak=now-lastPop<2600?Math.min(5,streak+1):1;bestStreak=Math.max(bestStreak,streak);lastPop=now;moves++;let gain=Math.min(12,cells.length*.42+(cells.length>=5?.8:0)+(streak>1?.25:0));seconds=Math.min(CAP,seconds+gain);let points=cells.length*10*streak+(cells.length>=6?60:0);score+=points;$('#score').textContent=score;float('+'+points,x-20,y);float('+'+gain.toFixed(1)+'s',x+34,y-8,true);popSound(cells.length,streak);$('#hint').classList.add('hidden');setTimeout(()=>{for(let n of cells)board[n]=null;refill();busy=false},180)}
$('#field').addEventListener('click',e=>{let el=e.target.closest('.orb');if(el)pop(Number(el.dataset.i),el)});$('#field').addEventListener('pointerover',preview);$('#field').addEventListener('pointerleave',clearPreview);$('#field').addEventListener('focusin',preview);$('#field').addEventListener('focusout',clearPreview);
function tick(){if(!playing||document.hidden)return;let now=performance.now(),delta=Math.max(0,(now-lastTick)/1000);lastTick=now;elapsedRun+=delta;pace=Math.min(3.5,1+elapsedRun/38);seconds=Math.max(0,seconds-delta*pace);let paceLabel='PACE ×'+pace.toFixed(1);if($('#pace').textContent!==paceLabel){$('#pace').textContent=paceLabel;$('#field').style.setProperty('--pulse',(2.8/Math.sqrt(pace)).toFixed(2)+'s');$('#field').style.setProperty('--fall-duration',(.37/Math.sqrt(pace)).toFixed(2)+'s')}let level=Math.floor(pace);if(level>lastPaceLevel){lastPaceLevel=level;float('PACE ×'+level,innerWidth/2,innerHeight/3,true);levelSound()}$('#time').textContent=seconds.toFixed(1);$('#timebar').style.width=seconds/CAP*100+'%';if(seconds<=0)finish()}
function start(){audioReady();playing=true;busy=false;score=0;seconds=START;lastTick=performance.now();elapsedRun=0;pace=1;lastPaceLevel=1;$('#pace').textContent='PACE ×1.0';$('#field').style.setProperty('--pulse','2.8s');$('#field').style.setProperty('--fall-duration','.37s');lastPop=0;streak=0;bestStreak=0;moves=0;$('#score').textContent='0';$('#time').textContent=START.toFixed(1);$('#timebar').style.width=START/CAP*100+'%';$('#hint').classList.remove('hidden');$('#overlay').classList.add('hidden');seed();clearInterval(interval);interval=setInterval(tick,80)}
function finish(){playing=false;endSound();clearInterval(interval);$('#time').textContent='0.0';$('#timebar').style.width='0%';let record=score>best;if(record){best=score;try{localStorage.setItem('one-more-orbs-best',String(best))}catch(e){}$('#best').textContent=best}$('#overlay').innerHTML=`<div class="card"><h1>${score.toLocaleString()}.</h1><p>${moves} pops · best streak ×${bestStreak}${record?' · new best':''}<br>The orbs are still here.</p><button id="play">ONE MORE</button></div>`;$('#overlay').classList.remove('hidden')}
$('#overlay').addEventListener('click',e=>{if(e.target.id==='play')start()});$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent='SOUND '+(sound?'ON':'OFF');$('#sound').setAttribute('aria-pressed',String(sound));if(sound)note(520,.12)};document.addEventListener('visibilitychange',()=>{lastTick=performance.now()});seed();
</script>
</body>
